[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-defending-soc"
version = "0.1.0"
description = "Self-defending SOC lab — Estate and Ingest layers"
readme = "docs/project-overview.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
kafka = ["confluent-kafka>=2.3"]

[project.scripts]
estate = "estate.cli:main"
ingest = "ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ingest = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
