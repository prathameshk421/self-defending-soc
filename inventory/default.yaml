schema_version: 1
lab_id: default
assets:
  - asset_id: "11111111-1111-4111-8111-111111111101"
    lab_id: default
    kind: lab_network
    name: lab-net
    owner: lab_app
    lifecycle: declared
    execution_realm: lab
    respond_allowed: true
    self_defense_class: watch_only
    owner_ref: lab-ops
    approval_policy_id: default-hitl
    exposure: lab_network
    aliases: ["lab-net"]
    containment_handles:
      - kind: lab_fw_object
        locator: "lab-net"
    in_scope_red_team: false
    red_team_skip: true

  - asset_id: "11111111-1111-4111-8111-111111111102"
    lab_id: default
    kind: lab_service
    name: lab-shop
    owner: lab_app
    lifecycle: declared
    execution_realm: lab
    respond_allowed: true
    self_defense_class: contain_with_degraded_mode
    owner_ref: lab-ops
    approval_policy_id: default-hitl
    exposure: published
    aliases: ["lab-shop", "shop.lab.local", "hostname:shop.lab.local"]
    log_sources:
      - id: shop-http
        kind: file
        locator: "/var/log/lab-shop/access.log"
    attack_surface:
      - id: shop-http
        locator: "http://shop.lab.local:8080"
        scheme: http
        auth_scheme: none
    containment_handles:
      - kind: compose_service
        locator: "lab-shop"
    restore_handles:
      - kind: volume
        locator: "lab-shop-data"
    credential_refs:
      - name: shop_db_password
        ref: "env:LAB_SHOP_DB_PASSWORD"
    in_scope_red_team: true

  - asset_id: "11111111-1111-4111-8111-111111111103"
    lab_id: default
    kind: lab_service
