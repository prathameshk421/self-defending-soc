    owner: lab_app
    lifecycle: declared
    execution_realm: lab
    respond_allowed: true
    self_defense_class: contain_with_degraded_mode
    owner_ref: lab-ops
    approval_policy_id: default-hitl
    exposure: lab_network
    aliases: ["lab-idp", "idp.lab.local"]
    log_sources:
      - id: idp-auth
        kind: file
        locator: "/var/log/lab-idp/auth.log"
    attack_surface:
      - id: idp-http
        locator: "http://idp.lab.local:8081"
        scheme: http
        auth_scheme: none
    containment_handles:
      - kind: compose_service
        locator: "lab-idp"
    in_scope_red_team: true

  - asset_id: "11111111-1111-4111-8111-111111111104"
