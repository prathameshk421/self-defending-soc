    execution_realm: lab
    respond_allowed: true
    self_defense_class: watch_only
    owner_ref: lab-ops
    approval_policy_id: default-hitl
    exposure: lab_network
    aliases: ["alice@idp.lab.local"]
    containment_handles:
      - kind: lab_account
        locator: "alice@idp.lab.local"
    in_scope_red_team: false
    red_team_skip: true

  - asset_id: "11111111-1111-4111-8111-111111111105"
    lab_id: default
