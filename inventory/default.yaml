    containment_handles:
      - kind: compose_service
        locator: "soc-agent-ingest"
    credential_refs:
      - name: kafka_ingest_password
        ref: "env:KAFKA_INGEST_PASSWORD"
    in_scope_red_team: false
    red_team_skip: true

